name: ${COMPOSE_PROJECT_NAME:-vju-club}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: club
      POSTGRES_USER: club
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [private]

  backend:
    build: ../backend/springboot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/club
      DB_USERNAME: club
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_TYPE: redis
      CORS_ALLOWED_ORIGINS: https://${FRONTEND_HOST}
      # absolute base for stored image URLs (club logo/cover, avatars); defaults to localhost otherwise
      APP_PUBLIC_API_BASE_URL: https://${API_HOST}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      STORAGE_TYPE: r2
      R2_ENDPOINT: ${R2_ENDPOINT:?set R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-st.vju.ac.vn}
      GOOGLE_CREATE_ACCOUNTS: ${GOOGLE_CREATE_ACCOUNTS:-true}
      AI_BASE_URL: ${AI_BASE_URL:-https://router.anhchau.all1.vn/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-apmarket}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-VJU ClubHub}
      SMTP_START_TLS: ${SMTP_START_TLS:-true}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID:-}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET:-}
      FACEBOOK_GRAPH_VERSION: ${FACEBOOK_GRAPH_VERSION:-v22.0}
      FACEBOOK_TOKEN_ENCRYPTION_KEY: ${FACEBOOK_TOKEN_ENCRYPTION_KEY:-}
      FACEBOOK_OAUTH_REDIRECT_URI: ${FACEBOOK_OAUTH_REDIRECT_URI:-https://${API_HOST}/api/v1/integrations/facebook/oauth/callback}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-https://${FRONTEND_HOST}}
      APP_QR_SECRET: ${APP_QR_SECRET:-}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-15}
      RATE_LIMIT_WRITE_MAX_REQUESTS: ${RATE_LIMIT_WRITE_MAX_REQUESTS:-60}
      RATE_LIMIT_CHAT_UPLOAD_MAX_REQUESTS: ${RATE_LIMIT_CHAT_UPLOAD_MAX_REQUESTS:-15}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_THREAD_ID: ${TELEGRAM_THREAD_ID:-}
    mem_limit: ${BACKEND_MEM_LIMIT:-1024m}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8110}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/api-catalog HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [private, edge]

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST}
    restart: unless-stopped
    depends_on: [backend]
    mem_limit: 512m
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3110}:3000"
    networks: [edge]

volumes:
  postgres-data:
  redis-data:

networks:
  private:
  edge:
