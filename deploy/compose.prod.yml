name: vju-club

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: club
      POSTGRES_USER: club
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]

  backend:
    build: ../backend/springboot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/club
      DB_USERNAME: club
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ALLOWED_ORIGINS: https://${FRONTEND_HOST}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      STORAGE_TYPE: r2
      R2_ENDPOINT: ${R2_ENDPOINT:?set R2_ENDPOINT}
      R2_BUCKET: ${R2_BUCKET:?set R2_BUCKET}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?set R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?set R2_SECRET_ACCESS_KEY}
    mem_limit: 1024m
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8110}:8080"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /api/v1/api-catalog HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s
    networks: [private, edge]

  frontend:
    build:
      context: ../frontend/nextjs
      args:
        NEXT_PUBLIC_API_URL: https://${API_HOST}
    restart: unless-stopped
    depends_on: [backend]
    mem_limit: 512m
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3110}:3000"
    networks: [edge]

volumes:
  postgres-data:

networks:
  private:
  edge:
