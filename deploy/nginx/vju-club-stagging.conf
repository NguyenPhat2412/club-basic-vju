# Host nginx site for VJU ClubHub Stagging (single-origin Frontend + API).
# Install as /etc/nginx/sites-available/vju-club-stagging, symlink into sites-enabled,
# and run: certbot --nginx -d stagging.vju-club.all1.vn
limit_req_zone $binary_remote_addr zone=vju_club_stagging_login:10m rate=20r/m;

server {
    listen 80;
    listen [::]:80;
    server_name stagging.vju-club.all1.vn;
    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/v1/auth/login {
        limit_req zone=vju_club_stagging_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8111;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8111;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location ^~ /v3/api-docs {
        proxy_pass http://127.0.0.1:8111;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /swagger-ui {
        proxy_pass http://127.0.0.1:8111;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /_next/static/ {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 365d;
    }

    location ^~ /images/ {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3111;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
