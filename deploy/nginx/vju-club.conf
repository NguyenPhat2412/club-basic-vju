# Host nginx site for VJU ClubHub. Install as /etc/nginx/sites-available/vju-club and link it into
# sites-enabled; certbot --nginx adds the TLS lines. The containers listen on 127.0.0.1 only.
limit_req_zone $binary_remote_addr zone=vju_club_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name vju-club.all1.vn;

    location / {
        proxy_pass http://127.0.0.1:3110;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name api.vju-club.all1.vn;
    client_max_body_size 25m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /api/v1/auth/login {
        limit_req zone=vju_club_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8110;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8110;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
