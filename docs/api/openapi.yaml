components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: CLUB_SESSION
      description: 'Cookie phiên do POST /auth/login đặt. Request thay đổi dữ liệu cần thêm header X-XSRF-TOKEN.'
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 'Chưa đăng nhập hoặc phiên đã hết hạn/bị huỷ (code UNAUTHORIZED); đăng nhập lại.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Permission denied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Trùng dữ liệu hoặc trạng thái hiện tại không cho phép thao tác.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Không tìm thấy resource hoặc grant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    CreateClubApplicationRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
    ReviewClubApplicationRequest:
      type: object
      properties:
        reviewNote:
          type: string
          maxLength: 1000
    ClubApplication:
      type: object
      required: [id, applicantId, clubId, clubCode, clubName, message, status, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        applicantId: {type: string, format: uuid}
        clubId: {type: string, format: uuid}
        clubCode: {type: string}
        clubName: {type: string}
        message: {type: string}
        status: {type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED]}
        reviewedBy: {type: [string, 'null'], format: uuid}
        reviewedAt: {type: [string, 'null'], format: date-time}
        reviewNote: {type: [string, 'null']}
        cancelledAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        membershipId: {type: [string, 'null'], format: uuid}
        membershipStatus: {type: [string, 'null'], enum: [ACTIVE, INACTIVE, LEFT, SUSPENDED]}
        membershipJoinedAt: {type: [string, 'null'], format: date-time}
    ClubApplicationListResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ClubApplication'}
        total: {type: integer, format: int64}
        offset: {type: integer}
        limit: {type: integer}
    MyClubApplicationListResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, clubId, clubCode, clubName, status, createdAt]
            properties:
              id: {type: string, format: uuid}
              clubId: {type: string, format: uuid}
              clubCode: {type: string}
              clubName: {type: string}
              status: {type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED]}
              createdAt: {type: string, format: date-time}
              reviewedAt: {type: [string, 'null'], format: date-time}
              cancelledAt: {type: [string, 'null'], format: date-time}
        total: {type: integer, format: int64}
        offset: {type: integer}
        limit: {type: integer}
    MyMembershipListResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/MyMembership'}
        total: {type: integer, format: int64}
        offset: {type: integer}
        limit: {type: integer}
    MyMembership:
      type: object
      required: [id, clubId, clubCode, clubName, status, joinedAt, createdAt, updatedAt, departments]
      properties:
        id: {type: string, format: uuid}
        clubId: {type: string, format: uuid}
        clubCode: {type: string}
        clubName: {type: string}
        status: {type: string, enum: [ACTIVE, INACTIVE, LEFT, SUSPENDED]}
        joinedAt: {type: string, format: date-time}
        leftAt: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        departments:
          type: array
          items:
            type: object
            required: [id, name, joinedAt]
            properties:
              id: {type: string, format: uuid}
              name: {type: string}
              joinedAt: {type: string, format: date-time}
    Notification:
      type: object
      required: [id, title, message, read, createdAt]
      properties:
        id: {type: string, format: uuid}
        title: {type: string, maxLength: 160}
        message: {type: string, maxLength: 2000}
        read: {type: boolean}
        referenceId: {type: [string, 'null'], format: uuid}
        createdAt: {type: string, format: date-time}
    NotificationListResponse:
      type: object
      required: [items, total, offset, limit]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Notification'}
        total: {type: integer, format: int64}
        offset: {type: integer}
        limit: {type: integer}
    CreateUserRequest:
      type: object
      required:
      - email
      - password
      - fullName
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: '8+ ký tự, tối đa 72 byte UTF-8 (giới hạn của BCrypt; chữ có dấu tốn 2–3 byte)'
        fullName:
          type: string
          maxLength: 200
        studentCode:
          type:
          - string
          - 'null'
          maxLength: 50
        phone:
          type:
          - string
          - 'null'
          maxLength: 32
          pattern: '^[0-9+().\- ]*$'
      examples:
      - email: phat@example.test
        password: DemoPassword123!
        fullName: Nguyễn Xuân Phát
        studentCode: '23110209'
        phone: 0900000000
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      examples:
      - email: phat@example.test
        password: DemoPassword123!
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: '8+ ký tự, tối đa 72 byte UTF-8 (giới hạn của BCrypt; chữ có dấu tốn 2–3 byte)'
      examples:
      - currentPassword: DemoPassword123!
        newPassword: NewDemoPassword456!
    AuthResponse:
      type: object
      required:
      - user
      properties:
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
        fullName:
          type: string
        studentCode:
          type:
          - string
          - 'null'
        phone:
          type:
          - string
          - 'null'
        avatarUrl:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - email
      - fullName
      - studentCode
      - phone
      - avatarUrl
      - status
      - createdAt
      - updatedAt
      examples:
      - id: 11111111-1111-4111-8111-111111111111
        email: phat@example.test
        fullName: Nguyễn Xuân Phát
        studentCode: '23110209'
        phone: 0900000000
        avatarUrl: null
        status: ACTIVE
        createdAt: '2026-09-29T12:00:00Z'
        updatedAt: '2026-09-29T12:00:00Z'
    UpdateProfileRequest:
      type: object
      properties:
        fullName:
          type: string
          maxLength: 200
        phone:
          type:
          - string
          - 'null'
          maxLength: 32
          pattern: '^[0-9+().\- ]*$'
        avatarUrl:
          type:
          - string
          - 'null'
          maxLength: 500
          format: uri
          pattern: '^(https?://.+)?$'
      examples:
      - fullName: Nguyễn Xuân Phát
        phone: 0900000000
    UpdateUserStatusRequest:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      examples:
      - status: INACTIVE
    ClubRequest:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
          maxLength: 50
        name:
          type: string
          maxLength: 200
        logoUrl:
          type:
          - string
          - 'null'
          maxLength: 500
          format: uri
          pattern: '^(https?://.+)?$'
        coverUrl:
          type:
          - string
          - 'null'
          maxLength: 500
          format: uri
          pattern: '^(https?://.+)?$'
