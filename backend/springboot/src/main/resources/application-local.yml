spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/club}
    username: ${DB_USERNAME:club}
    password: ${DB_PASSWORD:club_local}

app:
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-change-this-value-0123456789}
