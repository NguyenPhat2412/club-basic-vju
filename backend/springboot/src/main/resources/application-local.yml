spring:
  config:
    activate:
      on-profile: local
    # Local secrets live in backend/springboot/.env.local (KEY=value lines, git-ignored), read the same
    # way on macOS, Linux and Windows; real environment variables still take precedence.
    import: optional:file:.env.local[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/club}
    username: ${DB_USERNAME:club}
    password: ${DB_PASSWORD:club_local}

app:
  # Local development runs over plain http.
  session:
    cookie-secure: ${SESSION_COOKIE_SECURE:false}
  # Demo club VJUA with 4 departments and users demo.a/b/c@vju.local; skipped without DEMO_USER_PASSWORD.
  demo-data:
    enabled: ${DEMO_DATA_ENABLED:true}
    password: ${DEMO_USER_PASSWORD:}
  # Shared development admin, created on first start of the local profile only (never in production).
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin123@gmail.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:Admin123@}
