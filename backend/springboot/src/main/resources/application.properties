server.port=8080
spring.application.name=club-basic-vju
spring.jackson.default-property-inclusion=non_null

# PostgreSQL connection settings. The current vertical slice still uses in-memory repositories;
# these properties are ready for the persistence migration.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:55432/vju_club}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vju}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:vju_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver
