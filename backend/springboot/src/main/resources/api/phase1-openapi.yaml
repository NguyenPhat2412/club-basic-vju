openapi: 3.1.0
info:
  title: VJU Club Management API
  version: 1.0.0
  description: 'API giai đoạn 1 cho quản lý tài khoản, CLB, ban, thành viên và permission.
    Xem x-implementation-status từng operation: PLANNED là chưa xác nhận qua integration
    test. UUID, camelCase, thời gian ISO-8601. List dùng offset/limit; không có page/size.'
servers:
- url: /api/v1
  description: Backend cùng origin với Swagger UI
- url: http://localhost:8080/api/v1
  description: Backend local mặc định
security:
- bearerAuth: []
paths:
  /api-catalog:
    get:
      operationId: system.apiCatalog
      summary: List API catalog
      tags:
      - System
      x-permission: null
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: API catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiCatalogEntry'
              example:
              - method: GET
                path: /api/v1/api-catalog
                module: system
                backend: backend/springboot
                status: IMPLEMENTED
                authRequired: false
                permission: null
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /auth/register:
    post:
      operationId: auth.register
      summary: Register account
      tags:
      - Auth
      x-permission: null
      x-implementation-status: PLANNED
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                email: phat@example.test
                fullName: Nguyễn Xuân Phát
                studentCode: '23110209'
                phone: 0900000000
                avatarUrl: null
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: phat@example.test
              password: DemoPassword123!
              fullName: Nguyễn Xuân Phát
              studentCode: '23110209'
              phone: 0900000000
      description: Tạo tài khoản ACTIVE, không tự cấp permission hoặc tạo membership.
        Mật khẩu được hash. Email trùng trả 409.
  /auth/login:
    post:
      operationId: auth.login
      summary: Login
      tags:
      - Auth
      x-permission: null
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  email: phat@example.test
                  fullName: Nguyễn Xuân Phát
                  studentCode: '23110209'
                  phone: 0900000000
                  avatarUrl: null
                  status: ACTIVE
                  createdAt: '2026-09-29T12:00:00Z'
                  updatedAt: '2026-09-29T12:00:00Z'
                tokens:
                  accessToken: example-access-token-replace-after-login
                  refreshToken: example-refresh-token-replace-after-login
                  accessTokenExpiresAt: '2026-09-29T12:15:00Z'
                  refreshTokenExpiresAt: '2026-10-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: phat@example.test
              password: DemoPassword123!
      description: Trả user và tokens. Tài khoản INACTIVE bị từ chối. Dùng tokens.accessToken
        cho Bearer; giữ refreshToken để làm mới phiên.
  /auth/logout:
    post:
      operationId: auth.logout
      summary: Logout
      tags:
      - Auth
      x-permission: null
      x-implementation-status: PLANNED
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: example-refresh-token-replace-after-login
      description: Thu hồi refresh token của phiên. Frontend xóa token đã lưu sau
        204; không parse JSON body.
  /auth/refresh-token:
    post:
      operationId: auth.refreshToken
      summary: Refresh access token
      tags:
      - Auth
      x-permission: null
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  email: phat@example.test
                  fullName: Nguyễn Xuân Phát
                  studentCode: '23110209'
                  phone: 0900000000
                  avatarUrl: null
                  status: ACTIVE
                  createdAt: '2026-09-29T12:00:00Z'
                  updatedAt: '2026-09-29T12:00:00Z'
                tokens:
                  accessToken: example-access-token-replace-after-login
                  refreshToken: example-refresh-token-replace-after-login
                  accessTokenExpiresAt: '2026-09-29T12:15:00Z'
                  refreshTokenExpiresAt: '2026-10-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
            example:
              refreshToken: example-refresh-token-replace-after-login
      description: 'Refresh token chỉ dùng một lần: lưu cặp token mới và thay refreshToken
        cũ. Token hết hạn/đã thu hồi trả 401.'
  /auth/me:
    get:
      operationId: auth.me
      summary: Get current account
      tags:
      - Auth
      x-permission: null
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                email: phat@example.test
                fullName: Nguyễn Xuân Phát
                studentCode: '23110209'
                phone: 0900000000
                avatarUrl: null
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      description: Tài khoản hiện tại theo JWT. Chỉ cần đăng nhập; không cần quyền
        quản trị user.view.
  /auth/change-password:
    post:
      operationId: auth.changePassword
      summary: Change password
      tags:
      - Auth
      x-permission: null
      x-implementation-status: PLANNED
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: DemoPassword123!
              newPassword: NewDemoPassword456!
      description: Xác minh currentPassword, đổi mật khẩu và thu hồi refresh token.
        Sau 204, frontend xóa token và yêu cầu đăng nhập lại.
  /users/me:
    get:
      operationId: user.me
      summary: Get current profile
      tags:
      - User
      x-permission: null
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                email: phat@example.test
                fullName: Nguyễn Xuân Phát
                studentCode: '23110209'
                phone: 0900000000
                avatarUrl: null
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      description: Chỉ đọc profile của tài khoản hiện tại. Không cần user.view.
    patch:
      operationId: user.updateMe
      summary: Update current profile
      tags:
      - User
      x-permission: null
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                email: phat@example.test
                fullName: Nguyễn Xuân Phát
                studentCode: '23110209'
                phone: 0900000000
                avatarUrl: null
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              fullName: Nguyễn Xuân Phát
              phone: 0900000000
      description: Cập nhật fullName, phone, avatarUrl của tài khoản hiện tại. Không
        cho sửa status, permission hay membership. Field bỏ qua/null giữ nguyên.
  /users:
    get:
      operationId: user.list
      summary: List users
      tags:
      - User
      x-permission: user.view
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  email: phat@example.test
                  fullName: Nguyễn Xuân Phát
                  studentCode: '23110209'
                  phone: 0900000000
                  avatarUrl: null
                  status: ACTIVE
                  createdAt: '2026-09-29T12:00:00Z'
                  updatedAt: '2026-09-29T12:00:00Z'
                total: 1
                offset: 0
                limit: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      parameters:
      - name: query
        in: query
        schema:
          type: string
          default: ''
        description: Tìm theo tên/mã CLB hoặc email/họ tên/mã sinh viên tùy endpoint.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Số bản ghi bỏ qua; bắt đầu từ 0.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
        description: Số bản ghi tối đa trong một lần lấy, mặc định 20, tối đa 100.
      - name: orderBy
        in: query
        description: Cột sắp xếp được backend cho phép.
        schema:
          type: string
          enum:
          - email
          - fullName
          - createdAt
          - status
          default: createdAt
      - name: orderType
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
  /users/{userId}:
    get:
      operationId: user.get
      summary: Get user
      tags:
      - User
      x-permission: user.view
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                email: phat@example.test
                fullName: Nguyễn Xuân Phát
                studentCode: '23110209'
                phone: 0900000000
                avatarUrl: null
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /users/{userId}/status:
    patch:
      operationId: user.status
      summary: Update user status
      tags:
      - User
      x-permission: user.active | user.inactive
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                email: phat@example.test
                fullName: Nguyễn Xuân Phát
                studentCode: '23110209'
                phone: 0900000000
                avatarUrl: null
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserStatusRequest'
            example:
              status: INACTIVE
      x-permission-rules:
        ACTIVE: user.active
        INACTIVE: user.inactive
      description: 'Quyền phụ thuộc trạng thái mới trong body: ACTIVE → user.active,
        INACTIVE → user.inactive.'
  /users/me/permissions:
    get:
      operationId: user.permissions
      summary: List current permissions
      tags:
      - User
      x-permission: null
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPermission'
              example:
              - id: 66666666-6666-4666-8666-666666666666
                userId: 11111111-1111-4111-8111-111111111111
                permissionId: 55555555-5555-4555-8555-555555555555
                permissionKey: club.update
                scope: CLUB
                clubId: 22222222-2222-4222-8222-222222222222
                departmentId: null
                grantedAt: '2026-09-29T12:00:00Z'
                revokedAt: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      description: Danh sách grant đang có hiệu lực của chính mình, dùng hiển thị
        chức năng theo permissionKey và scope. Không cần permission.view.
  /clubs:
    get:
      operationId: club.list
      summary: List clubs
      tags:
      - Club
      x-permission: club.view
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubListResponse'
              example:
                items:
                - id: 22222222-2222-4222-8222-222222222222
                  code: VJUA
                  name: CLB VJUA
                  logoUrl: null
                  coverUrl: null
                  description: Câu lạc bộ sinh viên
                  activityField: Sinh viên
                  contactEmail: vjua@example.test
                  status: ACTIVE
                  createdAt: '2026-09-29T12:00:00Z'
                  updatedAt: '2026-09-29T12:00:00Z'
                total: 1
                offset: 0
                limit: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      parameters:
      - name: query
        in: query
        schema:
          type: string
          default: ''
        description: Tìm theo tên/mã CLB hoặc email/họ tên/mã sinh viên tùy endpoint.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Số bản ghi bỏ qua; bắt đầu từ 0.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
        description: Số bản ghi tối đa trong một lần lấy, mặc định 20, tối đa 100.
      description: Kết quả chỉ chứa CLB người gọi có club.view đúng scope; total là
        số CLB được phép xem sau lọc.
    post:
      operationId: club.create
      summary: Create club
      tags:
      - Club
      x-permission: club.create
      x-implementation-status: PLANNED
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
              example:
                id: 22222222-2222-4222-8222-222222222222
                code: VJUA
                name: CLB VJUA
                logoUrl: null
                coverUrl: null
                description: Câu lạc bộ sinh viên
                activityField: Sinh viên
                contactEmail: vjua@example.test
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubRequest'
            example:
              code: VJUA
              name: CLB VJUA
              description: Câu lạc bộ sinh viên
              contactEmail: vjua@example.test
  /clubs/{clubId}:
    get:
      operationId: club.get
      summary: Get club
      tags:
      - Club
      x-permission: club.view
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
              example:
                id: 22222222-2222-4222-8222-222222222222
                code: VJUA
                name: CLB VJUA
                logoUrl: null
                coverUrl: null
                description: Câu lạc bộ sinh viên
                activityField: Sinh viên
                contactEmail: vjua@example.test
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - name: clubId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: club.update
      summary: Update club
      tags:
      - Club
      x-permission: club.update
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
              example:
                id: 22222222-2222-4222-8222-222222222222
                code: VJUA
                name: CLB VJUA
                logoUrl: null
                coverUrl: null
                description: Câu lạc bộ sinh viên
                activityField: Sinh viên
                contactEmail: vjua@example.test
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: clubId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubPatchRequest'
            example:
              description: Thông tin mới
  /clubs/{clubId}/status:
    patch:
      operationId: club.status
      summary: Update club status
      tags:
      - Club
      x-permission: club.active | club.inactive
      x-implementation-status: PLANNED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Club'
              example:
                id: 22222222-2222-4222-8222-222222222222
                code: VJUA
                name: CLB VJUA
                logoUrl: null
                coverUrl: null
                description: Câu lạc bộ sinh viên
                activityField: Sinh viên
                contactEmail: vjua@example.test
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      parameters:
      - name: clubId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClubStatusRequest'
