      properties:
        eventId: {type: string, format: uuid}
        totalCount: {type: integer, format: int64}
        averageRating: {type: number, format: double}
        items:
          type: array
          items: {$ref: '#/components/schemas/EventFeedback'}
        canSubmit: {type: boolean}
    AttendedEventItem:
      type: object
      required: [eventId, clubId, clubCode, clubName, title, startTime, attendanceStatus, attendanceLocked]
      properties:
        eventId: {type: string, format: uuid}
        clubId: {type: string, format: uuid}
        clubCode: {type: string}
        clubName: {type: string}
        title: {type: string}
        academicTerm: {type: [string, 'null']}
        startTime: {type: string, format: date-time}
        attendanceStatus: {type: string}
        attendanceLocked: {type: boolean}
        attendanceLockedAt: {type: [string, 'null'], format: date-time}
        attendanceSignatureSha256: {type: [string, 'null']}
    StudentTrainingPointItem:
      type: object
      required: [userId, fullName, email, activeClubs, presentEventCount, attendedEventTitles, attendedEvents]
      properties:
        userId: {type: string, format: uuid}
        fullName: {type: string}
        studentCode: {type: [string, 'null']}
        email: {type: string, format: email}
        activeClubs:
          type: array
          items: {type: string}
        presentEventCount: {type: integer}
        attendedEventTitles:
          type: array
          items: {type: string}
        attendedEvents:
          type: array
          items: {$ref: '#/components/schemas/AttendedEventItem'}
    TrainingPointReport:
      type: object
      required: [generatedAt, clubName, totalStudents, totalPresentCheckIns, items]
      properties:
        generatedAt: {type: string, format: date-time}
        clubId: {type: [string, 'null'], format: uuid}
        clubName: {type: string}
        academicTerm: {type: [string, 'null']}
        from: {type: [string, 'null'], format: date-time}
        to: {type: [string, 'null'], format: date-time}
        totalStudents: {type: integer}
        totalPresentCheckIns: {type: integer}
        items:
          type: array
          items: {$ref: '#/components/schemas/StudentTrainingPointItem'}
