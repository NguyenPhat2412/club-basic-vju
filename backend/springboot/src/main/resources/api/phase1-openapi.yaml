      summary: Approve a club application and create membership
      description: 'Yêu cầu application.approve hoặc application.review tại CLUB trên URL. Chỉ xử lý PENDING; tạo Membership ACTIVE và chuyển đơn APPROVED trong cùng transaction. Trả 409 APPLICATION_ALREADY_REVIEWED hoặc DUPLICATE_MEMBERSHIP; lỗi tạo membership rollback toàn bộ thao tác. Response gồm membershipId, membershipStatus và membershipJoinedAt. Tạo membership và cấp các vai trò có granted_on_join (CLUB_MEMBER) trong CLB. 409 CLUB_INACTIVE nếu CLB tạm dừng, 409 USER_INACTIVE nếu tài khoản người nộp bị khoá, 409 APPLICATION_ATTACHMENT_REQUIRED nếu form bắt buộc đính kèm mà đơn chưa có file, 409 MEMBERSHIP_LIMIT_REACHED nếu sinh viên đã đủ số CLB tối đa trong /system-settings.'
