openapi: 3.1.0
info:
  title: VJU Club Management API
  version: 1.0.0
  description: Phase 1 end-to-end API contract for frontend consumers.
servers:
- url: http://localhost:8080/api/v1
security:
- bearerAuth: []
paths:
  /api-catalog:
    get:
      operationId: system.apiCatalog
      summary: List API catalog
      tags:
      - System
      x-permission: null
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: API catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiCatalogEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /auth/register:
    post:
      operationId: auth.register
      summary: Register account
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
  /auth/login:
    post:
      operationId: auth.login
