        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: clubApplication.create
      summary: Submit a club application
      description: >-
        Applicant ACTIVE gửi đơn cho CLB ACTIVE bằng ownership. Trạng thái và
        các trường xét duyệt do backend quản lý. Trả 409 APPLICATION_ALREADY_PENDING
        hoặc ALREADY_CLUB_MEMBER khi đã có đơn PENDING hoặc membership chưa kết thúc.
        Sinh viên chỉ nộp qua form OPEN trong khung openAt–closeAt: trước openAt trả 409
        APPLICATION_NOT_OPEN_YET; form DRAFT/CLOSED, sau closeAt, hoặc CLB có form nhưng không
        form nào OPEN trả 409 APPLICATION_FORM_CLOSED. CLB chưa từng tạo form nhận đơn theo form
        mặc định. Người quản lý nhập đơn hộ (applicantId, yêu cầu quyền application.create) không bị giới hạn khung thời gian.
        Sinh viên tự nộp còn chịu các giới hạn trong /system-settings: 409 APPLICATION_PENDING_LIMIT,
