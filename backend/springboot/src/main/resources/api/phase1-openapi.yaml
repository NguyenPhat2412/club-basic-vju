openapi: 3.1.0
info:
  title: VJU Club Management API
  version: 1.0.0
  description: 'API giai đoạn 1 cho quản lý tài khoản, CLB, ban, thành viên và permission.
    Xem x-implementation-status từng operation: IMPLEMENTED là đã xác nhận qua integration
    test. UUID, camelCase, thời gian ISO-8601. List dùng offset/limit; không có page/size.'
servers:
- url: /api/v1
  description: Backend cùng origin với Swagger UI
- url: http://localhost:8080/api/v1
  description: Backend local mặc định
security:
- sessionAuth: []
paths:
  /api-catalog:
    get:
      operationId: system.apiCatalog
      summary: List API catalog
      tags:
      - System
      x-permission: null
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: API catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiCatalogEntry'
              example:
              - method: GET
                path: /api/v1/api-catalog
                module: system
                backend: backend/springboot
                status: IMPLEMENTED
                authRequired: false
                permission: null
        '400':
          $ref: '#/components/responses/BadRequest'
      security: []
  /auth/csrf:
    get:
      operationId: auth.csrf
      summary: Get CSRF cookie
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      responses:
        '204':
          description: Đặt cookie XSRF-TOKEN (không HttpOnly) để frontend gửi lại trong header X-XSRF-TOKEN
      security: []
      description: 'Gọi trước request POST/PUT/PATCH/DELETE đầu tiên nếu trình duyệt chưa có cookie XSRF-TOKEN.'
  /auth/login:
    post:
      operationId: auth.login
      summary: Login
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
              example:
                user:
                  id: 11111111-1111-4111-8111-111111111111
                  email: phat@example.test
                  fullName: Nguyễn Xuân Phát
                  studentCode: '23110209'
                  phone: 0900000000
                  avatarUrl: null
                  status: ACTIVE
                  createdAt: '2026-09-29T12:00:00Z'
                  updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: phat@example.test
              password: DemoPassword123!
      description: 'Trả user và đặt cookie phiên CLUB_SESSION (HttpOnly, SameSite=Lax). Không có token trong body.
        Gửi kèm header X-XSRF-TOKEN lấy từ cookie XSRF-TOKEN (GET /auth/csrf). Tài khoản INACTIVE bị từ chối (403).
        Tài khoản do admin cấp (POST /users) hoặc tự đăng ký (POST /auth/register); quên mật khẩu liên hệ admin. Khi bật đăng nhập Google, email thuộc
        tên miền trường (mặc định st.vju.ac.vn) chưa tự đăng ký mật khẩu bị từ chối ở đây với 403 GOOGLE_SIGN_IN_REQUIRED; dùng POST /auth/google.'
  /auth/register:
    post:
      operationId: auth.register
      summary: Self-register a student or member account
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      security: []
      description: 'Tạo tài khoản mới ở trạng thái ACTIVE (requiresPasswordChange=false) và đăng nhập ngay (đặt cookie CLUB_SESSION HttpOnly).
        Kiểm tra trùng email (409 EMAIL_ALREADY_EXISTS) và trùng mã sinh viên (409 STUDENT_CODE_ALREADY_EXISTS).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: phat.nguyen@st.vju.ac.vn
              password: DemoPassword123!
              fullName: Nguyễn Xuân Phát
              studentCode: '23110209'
              phone: 0900000000
      responses:
        '201':
          description: Created and signed in
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /auth/google:
    post:
      operationId: auth.google
      summary: Sign in with a school Google account
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      security: []
      description: 'Nhận ID token (credential) mà nút "Sign in with Google" trả cho trình duyệt. Backend kiểm tra
        chữ ký với khoá công khai của Google, iss, aud (= GOOGLE_CLIENT_ID), hạn dùng, email_verified, có hd
        (tài khoản do trường quản lý) và email thuộc tên miền cho phép. Đăng nhập (register bỏ trống) không bao giờ
        tạo tài khoản: email chưa đăng ký trả 403 GOOGLE_ACCOUNT_NOT_REGISTERED để trang đăng nhập chuyển sang trang
        đăng ký. Đăng ký (register=true) tạo một tài khoản sinh viên thường nếu chưa có (họ tên, ảnh từ Google;
        phần trước @ là mã sinh viên nếu là dãy số và chưa ai dùng; không vai trò, không CLB; vào CLB bằng cách
        nộp đơn) rồi đăng nhập luôn; nếu đã có thì chỉ đăng nhập. GOOGLE_CREATE_ACCOUNTS=false đóng đăng ký
        (403 GOOGLE_SIGN_UP_CLOSED).
        Lần đầu gắn tài khoản với Google ID (sub); về sau Google ID khác
        cùng email bị từ chối. Thành công thì đặt cookie phiên CLUB_SESSION như /auth/login. Cần header
        X-XSRF-TOKEN; giới hạn số lần như /auth/login. Lỗi: 401 GOOGLE_TOKEN_INVALID, 403 GOOGLE_DOMAIN_NOT_ALLOWED,
        403 GOOGLE_ACCOUNT_NOT_REGISTERED, 403 GOOGLE_ACCOUNT_MISMATCH, 403 ACCOUNT_INACTIVE, 404 GOOGLE_SIGN_IN_DISABLED.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /auth/google/config:
    get:
      operationId: auth.google_config
      summary: Google sign-in settings for the login page
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      security: []
      description: Cho trang đăng nhập biết có hiện nút Google không và Client ID nào để dùng. Client ID là thông
        tin công khai. Khi chưa đặt GOOGLE_CLIENT_ID thì enabled=false, clientId=null.
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleSignInConfig'
              example:
                enabled: true
                clientId: 123456789-abc.apps.googleusercontent.com
                allowedDomains:
                - st.vju.ac.vn
  /auth/forgot-password:
    post:
      operationId: auth.forgotPassword
      summary: Request a 6-digit OTP password reset code via email
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      security: []
      description: 'Tạo mã xác thực OTP 6 chữ số (băm BCrypt lưu DB) theo giới hạn cấu hình trong /system-settings
        (otpExpiryMinutes, otpResendCooldownSeconds, otpMaxSendCount, otpMaxVerifyAttempts) và gửi email HTML định dạng
        3 tông màu VJU ClubHub tới người dùng. Luôn trả cấu trúc ForgotPasswordOtpResponse đồng nhất cho email không tồn tại
        hoặc vô hiệu hoá để chống dò quét tài khoản; trả 429 OTP_COOLDOWN_ACTIVE hoặc OTP_SEND_LIMIT_EXCEEDED nếu vượt tần suất.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
            example:
              email: sinhvien@st.vju.ac.vn
      responses:
        '200':
          description: OTP challenge policy returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForgotPasswordOtpResponse'
              example:
                expirySeconds: 300
                resendCooldownSeconds: 60
                maxVerifyAttempts: 5
                mailConfigured: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/reset-password:
    post:
      operationId: auth.resetPassword
      summary: Verify 6-digit OTP and set a new password
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      security: []
      description: 'Xác minh mã OTP 6 chữ số còn hiệu lực, kiểm tra số lần thử tối đa (otpMaxVerifyAttempts, ghi nhận trong
        transaction độc lập), đặt mật khẩu mới và thu hồi toàn bộ phiên đăng nhập cũ của tài khoản. Trả 400 OTP_INVALID hoặc
        OTP_EXPIRED, 403 ACCOUNT_LOCKED, hoặc 429 OTP_MAX_ATTEMPTS_EXCEEDED.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordWithOtpRequest'
            example:
              email: sinhvien@st.vju.ac.vn
              otp: '842916'
              newPassword: NewStrongPassword123!
      responses:
        '204':
          description: Password reset completed and existing sessions revoked
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout:
    post:
      operationId: auth.logout
      summary: Logout
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      responses:
        '204':
          description: Session revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      description: 'Huỷ phiên đăng nhập hiện tại trên server và xoá cookie CLUB_SESSION. Không có body.'
  /auth/me:
    get:
      operationId: auth.me
      summary: Get current account
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                email: phat@example.test
                fullName: Nguyễn Xuân Phát
                studentCode: '23110209'
                phone: 0900000000
                avatarUrl: null
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      description: Tài khoản hiện tại theo phiên đăng nhập cookie CLUB_SESSION. Chỉ cần đăng nhập; không cần quyền
        quản trị user.view.
  /auth/change-password:
    post:
      operationId: auth.changePassword
      summary: Change password
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            example:
              currentPassword: DemoPassword123!
              newPassword: NewDemoPassword456!
      description: Xác minh currentPassword, đổi mật khẩu và thu hồi các phiên đăng nhập khác của tài khoản.
        Phiên hiện tại vẫn được giữ nguyên (hoặc frontend làm mới thông tin tài khoản qua GET /auth/me).
  /auth/2fa/send:
    post:
      operationId: auth.twoFactorSend
      summary: Send 6-digit 2FA OTP code
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      security: []
      description: Gửi mã OTP 6 chữ số qua email cho xác thực 2 bước khi đăng nhập (LOGIN_2FA) hoặc xác nhận thao tác trọng yếu (CRITICAL_ACTION).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorSendRequest'
      responses:
        '200':
          description: OTP policy and delivery status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoFactorOtpPolicy'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/2fa/verify:
    post:
      operationId: auth.twoFactorVerify
      summary: Verify 6-digit 2FA OTP code
      tags:
      - Auth
      x-permission: null
      x-implementation-status: IMPLEMENTED
      security: []
      description: Xác minh mã OTP 2FA; với LOGIN_2FA hoàn tất đăng nhập và trả AuthResponse, với CRITICAL_ACTION trả TwoFactorVerifyResult.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TwoFactorVerifyRequest'
      responses:
        '200':
          description: 2FA verification succeeded
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TwoFactorVerifyResult'
                - $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /users/me:
    get:
      operationId: user.me
      summary: Get current profile
      tags:
      - User
      x-permission: null
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                email: phat@example.test
                fullName: Nguyễn Xuân Phát
                studentCode: '23110209'
                phone: 0900000000
                avatarUrl: null
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      description: Chỉ đọc profile của tài khoản hiện tại. Không cần user.view.
    patch:
      operationId: user.updateMe
      summary: Update current profile
      tags:
      - User
      x-permission: null
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                email: phat@example.test
                fullName: Nguyễn Xuân Phát
                studentCode: '23110209'
                phone: 0900000000
                avatarUrl: null
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
            example:
              fullName: Nguyễn Xuân Phát
              phone: 0900000000
      description: Cập nhật fullName, phone, avatarUrl của tài khoản hiện tại. Không
        cho sửa status, permission hay membership. Field bỏ qua/null giữ nguyên.
  /users/me/2fa:
    patch:
      operationId: user.setTwoFactor
      summary: Enable or disable optional 2FA OTP for current Tier 1-3 admin account
      tags:
      - User
      x-permission: null
      x-implementation-status: IMPLEMENTED
      description: Bật hoặc tắt xác thực 2 bước (2FA) qua email OTP cho tài khoản quản trị Tầng 1–3. Yêu cầu xác minh OTP nếu tắt 2FA khi đang bật.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetTwoFactorRequest'
      responses:
        '200':
          description: Updated user profile with twoFactorEnabled status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /users:
    post:
      operationId: user.create
      summary: Create account (admin)
      tags:
      - User
      x-permission: user.create
      x-implementation-status: IMPLEMENTED
      parameters:
      - name: X-2FA-OTP
        in: header
        required: false
        schema:
          type: string
          maxLength: 12
        description: Mã OTP 2FA bắt buộc nếu kèm roles và tài khoản thao tác đã bật 2FA (actionContext=ROLE_CHANGE).
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                email: phat@example.test
                fullName: Nguyễn Xuân Phát
                studentCode: '23110209'
                phone: 0900000000
                avatarUrl: null
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '400':
          $ref: '#/components/responses/BadRequest'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              email: phat@example.test
              password: DemoPassword123!
              fullName: Nguyễn Xuân Phát
              studentCode: '23110209'
              phone: 0900000000
      description: Chỉ admin (quyền user.create) tạo tài khoản; hệ thống không cho tự đăng ký.
        Tài khoản tạo ra ở trạng thái ACTIVE, chưa có permission hay membership. Mật khẩu được hash. Email trùng trả 409.
    get:
      operationId: user.list
      summary: List users
      tags:
      - User
      x-permission: user.view
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
              example:
                items:
                - id: 11111111-1111-4111-8111-111111111111
                  email: phat@example.test
                  fullName: Nguyễn Xuân Phát
                  studentCode: '23110209'
                  phone: 0900000000
                  avatarUrl: null
                  status: ACTIVE
                  createdAt: '2026-09-29T12:00:00Z'
                  updatedAt: '2026-09-29T12:00:00Z'
                total: 1
                offset: 0
                limit: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          $ref: '#/components/responses/BadRequest'
      parameters:
      - name: query
        in: query
        schema:
          type: string
          default: ''
        description: Tìm theo tên/mã CLB hoặc email/họ tên/mã sinh viên tùy endpoint.
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
        description: Số bản ghi bỏ qua; bắt đầu từ 0.
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          default: 20
          maximum: 100
        description: Số bản ghi tối đa trong một lần lấy, mặc định 20, tối đa 100.
      - name: orderBy
        in: query
        description: Cột sắp xếp được backend cho phép.
        schema:
          type: string
          enum:
          - email
          - fullName
          - createdAt
          - status
          default: createdAt
      - name: orderType
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
  /users/{userId}:
    get:
      operationId: user.get
      summary: Get user
      tags:
      - User
      x-permission: user.view
      x-implementation-status: IMPLEMENTED
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11111111-1111-4111-8111-111111111111
                email: phat@example.test
                fullName: Nguyễn Xuân Phát
                studentCode: '23110209'
                phone: 0900000000
                avatarUrl: null
                status: ACTIVE
                createdAt: '2026-09-29T12:00:00Z'
                updatedAt: '2026-09-29T12:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
