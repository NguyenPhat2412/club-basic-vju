      x-permission: application.approve | application.review
      x-scope: CLUB
      x-implementation-status: IMPLEMENTED
      parameters:
      - name: clubId
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: applicationId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReviewClubApplicationRequest'}
      responses:
        '200':
          description: Approved application and atomically created membership
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClubApplication'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
