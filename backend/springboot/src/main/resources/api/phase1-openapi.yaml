components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: CLUB_SESSION
      description: 'Cookie phiên do POST /auth/login đặt. Request thay đổi dữ liệu cần thêm header X-XSRF-TOKEN.'
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: 'Chưa đăng nhập hoặc phiên đã hết hạn/bị huỷ (code UNAUTHORIZED); đăng nhập lại.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 'Không đủ quyền. code: PERMISSION_DENIED; GRANT_EXCEEDS_OWN_PERMISSIONS (chỉ cấp/thu hồi
        được quyền mình đang có); SYSTEM_ADMIN_ONLY (chỉ SYSTEM_ADMIN cấp/thu hồi vai trò SYSTEM_ADMIN);
        PASSWORD_CHANGE_REQUIRED (phải đổi mật khẩu lần đầu, chỉ còn gọi được GET /auth/me, GET /users/me,
        POST /auth/change-password); CSRF_INVALID; ACCOUNT_INACTIVE.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: 'Trùng dữ liệu hoặc trạng thái hiện tại không cho phép thao tác. Gồm cả CANNOT_DEACTIVATE_SELF,
        CANNOT_REVOKE_OWN_ADMIN, LAST_SYSTEM_ADMIN và SYSTEM_ROLE_IMMUTABLE (vai trò SYSTEM_ADMIN bị khoá; vai trò hệ
        thống khác chỉ sửa được danh sách quyền và mô tả).'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Không tìm thấy resource hoặc grant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Vượt quá giới hạn tần suất hoặc số lần thử (rate limit / OTP cooldown).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ApplicationStatusCounts:
      type: object
      required: [pending, approved, rejected, cancelled, total, recent]
      properties:
        pending: {type: integer, format: int64}
        approved: {type: integer, format: int64}
        rejected: {type: integer, format: int64}
        cancelled: {type: integer, format: int64}
        total: {type: integer, format: int64}
        recent:
          type: array
          maxItems: 6
          description: Sáu đơn mới nhất trong phạm vi được xem
          items: {$ref: '#/components/schemas/MyClubApplicationSummary'}
    SystemSettings:
      type: object
      required: [maxPendingApplications, reapplyCooldownDays, maxActiveClubs, attendanceEditWindowHours, allowSelfRegistration, attendanceOpensBeforeMinutes, eventTaskGraceDays, chatSummariesPerHour, chatMaxMessageLength, chatMessagesPerMinute, documentMaxFileMb, clubImageMaxMb, avatarMaxMb, clubStorageQuotaMb, documentMaxVersions, maxChannelsPerClub, maxDepartmentsPerClub, maxActiveEventsPerClub, maxOpenTasksPerClub, broadcastCooldownMinutes, facebookSyncCooldownMinutes, facebookAutoSyncEnabled, facebookAutoSyncIntervalMinutes, otpExpiryMinutes, otpMaxSendCount, otpResendCooldownSeconds, otpMaxVerifyAttempts, smtpPort, smtpPasswordConfigured, smtpFromName, smtpStartTls, facebookAppSecretConfigured, facebookOauthConfigured, aiApiKeyConfigured, aiConfigured, googleSignInConfigured]
      properties:
        maxPendingApplications: {type: integer, minimum: 0, maximum: 100, description: Số đơn PENDING tối đa của một sinh viên trên mọi CLB; 0 = không giới hạn}
        reapplyCooldownDays: {type: integer, minimum: 0, maximum: 365, description: Số ngày chờ sau khi bị từ chối mới được nộp lại cùng CLB; 0 = không chờ}
        maxActiveClubs: {type: integer, minimum: 0, maximum: 100, description: Số CLB tối đa một sinh viên được tham gia cùng lúc (mặc định 5; 0 = không giới hạn)}
        attendanceEditWindowHours: {type: integer, minimum: 0, maximum: 720, description: Số giờ cho phép hiệu chỉnh điểm danh sau khi sự kiện chuyển COMPLETED}
        allowSelfRegistration: {type: boolean, description: Cho phép tự đăng ký bằng email hoặc Google; false = chỉ quản trị viên tạo tài khoản (403 SIGN_UP_CLOSED)}
        attendanceOpensBeforeMinutes: {type: integer, minimum: 0, maximum: 1440, description: Số phút trước giờ bắt đầu sự kiện thì được điểm danh}
        eventTaskGraceDays: {type: integer, minimum: 0, maximum: 90, description: Số ngày tối đa hạn công việc sự kiện được vượt quá giờ kết thúc}
        chatSummariesPerHour: {type: integer, minimum: 0, maximum: 100, description: Lượt tóm tắt AI mỗi người mỗi giờ; 0 = tắt (409 AI_SUMMARY_DISABLED)}
        chatMaxMessageLength: {type: integer, minimum: 100, maximum: 4000, description: Số ký tự tối đa của một tin nhắn (400 MESSAGE_TOO_LONG)}
        chatMessagesPerMinute: {type: integer, minimum: 1, maximum: 200, description: Số tin nhắn chat tối đa mỗi người trong 1 phút (429 CHAT_RATE_LIMIT_EXCEEDED)}
        documentMaxFileMb: {type: integer, minimum: 1, maximum: 20, description: Dung lượng tối đa (MB) của tài liệu và file đính kèm đơn}
        clubImageMaxMb: {type: integer, minimum: 1, maximum: 20, description: Dung lượng tối đa (MB) của logo/ảnh bìa CLB}
        avatarMaxMb: {type: integer, minimum: 1, maximum: 20, description: Dung lượng tối đa (MB) của ảnh đại diện}
        clubStorageQuotaMb: {type: integer, minimum: 50, maximum: 10240, description: Tổng hạn mức lưu trữ (MB) cho tài liệu và media chat của mỗi CLB (409 CLUB_STORAGE_QUOTA_EXCEEDED)}
        documentMaxVersions: {type: integer, minimum: 1, maximum: 100, description: Số phiên bản tối đa của một tài liệu (409 DOCUMENT_VERSION_LIMIT_REACHED)}
        maxChannelsPerClub: {type: integer, minimum: 1, maximum: 200, description: Số kênh chat tối đa của mỗi CLB (409 CHAT_CHANNEL_LIMIT_REACHED)}
        maxDepartmentsPerClub: {type: integer, minimum: 1, maximum: 100, description: Số ban chuyên môn tối đa của mỗi CLB (409 DEPARTMENT_LIMIT_REACHED)}
        maxActiveEventsPerClub: {type: integer, minimum: 1, maximum: 500, description: Số sự kiện đang hoạt động tối đa cùng lúc của mỗi CLB (409 EVENT_LIMIT_REACHED)}
        maxOpenTasksPerClub: {type: integer, minimum: 1, maximum: 2000, description: Số công việc chưa hoàn thành tối đa cùng lúc của mỗi CLB (409 TASK_LIMIT_REACHED)}
        broadcastCooldownMinutes: {type: integer, minimum: 0, maximum: 1440, description: Số phút phải chờ giữa 2 lần phát thông báo hàng loạt trong cùng CLB (429 BROADCAST_COOLDOWN_ACTIVE)}
        facebookSyncCooldownMinutes: {type: integer, minimum: 0, maximum: 1440, description: Số phút phải chờ giữa 2 lần đồng bộ Fanpage Facebook trong cùng CLB (429 FACEBOOK_SYNC_COOLDOWN)}
        facebookAutoSyncEnabled: {type: boolean, description: Bật/tắt tiến trình nền tự động đồng bộ bài viết & chỉ số Fanpage Facebook định kỳ}
        facebookAutoSyncIntervalMinutes: {type: integer, minimum: 15, maximum: 1440, description: Chu kỳ (phút) tự động đồng bộ lại Fanpage Facebook (mặc định 60 phút, 15..1440)}
        otpExpiryMinutes: {type: integer, minimum: 1, maximum: 60, description: Thời gian hiệu lực (phút) của một mã OTP khôi phục mật khẩu}
        otpMaxSendCount: {type: integer, minimum: 1, maximum: 30, description: Số lần tối đa một tài khoản được yêu cầu gửi mã OTP trong 60 phút}
        otpResendCooldownSeconds: {type: integer, minimum: 0, maximum: 600, description: Số giây phải chờ giữa hai lần gửi mã OTP liên tiếp; 0 = không chờ}
        otpMaxVerifyAttempts: {type: integer, minimum: 1, maximum: 15, description: Số lần nhập sai tối đa trước khi mã OTP tự động huỷ}
        smtpHost: {type: [string, 'null'], maxLength: 255, description: Máy chủ gửi thư SMTP (ví dụ smtp.gmail.com)}
        smtpPort: {type: integer, minimum: 1, maximum: 65535, description: Cổng kết nối SMTP (mặc định 587 cho STARTTLS)}
        smtpUsername: {type: [string, 'null'], maxLength: 255, description: Tài khoản đăng nhập máy chủ SMTP}
        smtpPasswordConfigured: {type: boolean, description: Đã lưu mật khẩu ứng dụng SMTP hay chưa (không trả mật khẩu thô)}
        smtpFromEmail: {type: [string, 'null'], format: email, maxLength: 320, description: Địa chỉ email người gửi hiển thị}
        smtpFromName: {type: string, maxLength: 120, description: Tên hiển thị người gửi (mặc định VJU ClubHub)}
        smtpStartTls: {type: boolean, description: Bật mã hoá STARTTLS khi gửi thư qua SMTP}
        facebookAppId: {type: [string, 'null'], maxLength: 64, description: Facebook App ID dùng cho OAuth kết nối Fanpage (để trống dùng FACEBOOK_APP_ID trong .env)}
        facebookAppSecretConfigured: {type: boolean, description: Đã lưu Facebook App Secret trong cài đặt hệ thống hay chưa (không trả secret thô)}
        facebookGraphVersion: {type: [string, 'null'], maxLength: 32, description: Phiên bản Facebook Graph API (mặc định v22.0)}
        facebookOauthRedirectUri: {type: [string, 'null'], maxLength: 500, description: Callback URL OAuth Facebook đã khai báo trên Meta for Developers}
        frontendBaseUrl: {type: [string, 'null'], maxLength: 500, description: URL gốc của giao diện Frontend để chuyển hướng sau khi đăng nhập Facebook OAuth}
        facebookOauthConfigured: {type: boolean, description: Trạng thái hiệu lực của Facebook OAuth (tính cả cài đặt hệ thống và .env)}
        aiBaseUrl: {type: [string, 'null'], maxLength: 500, description: Endpoint API của cổng AI tương thích OpenAI / 9router}
        aiApiKeyConfigured: {type: boolean, description: Đã lưu AI API Key trong cài đặt hệ thống hay chưa (không trả key thô)}
        aiModel: {type: [string, 'null'], maxLength: 120, description: Tên mô hình AI dùng cho tóm tắt thảo luận và dịch tự động}
        aiConfigured: {type: boolean, description: Trạng thái hiệu lực của cổng AI (tính cả cài đặt hệ thống và .env)}
        googleClientId: {type: [string, 'null'], maxLength: 255, description: Google OAuth Client ID cho đăng nhập tài khoản trường}
        googleAllowedDomains: {type: [string, 'null'], maxLength: 500, description: Danh sách tên miền email Google được phép (phân tách bằng dấu phẩy)}
        googleCreateAccounts: {type: [boolean, 'null'], description: Cho phép tự tạo tài khoản sinh viên mới khi đăng ký bằng Google (null = theo .env)}
        googleSignInConfigured: {type: boolean, description: Trạng thái hiệu lực của Google Sign-In (tính cả cài đặt hệ thống và .env)}
        updatedAt: {type: string, format: date-time}
        updatedBy: {type: [string, 'null'], format: uuid}
