      operationId: permission.grant
      summary: Grant permission
      tags:
      - Permission
      x-permission: permission.assign
      x-implementation-status: IMPLEMENTED
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPermission'
              example:
