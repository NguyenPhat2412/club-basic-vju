        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: Chưa xác thực (code UNAUTHORIZED) hoặc access token đã hết hạn (code
        AUTH_TOKEN_EXPIRED, nên gọi /auth/refresh-token).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Permission denied
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Trùng dữ liệu hoặc trạng thái hiện tại không cho phép thao tác.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Không tìm thấy resource hoặc grant.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    RegisterRequest:
      type: object
      required:
      - email
      - password
      - fullName
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
        fullName:
          type: string
          maxLength: 200
        studentCode:
          type:
          - string
          - 'null'
          maxLength: 50
        phone:
          type:
          - string
          - 'null'
          maxLength: 32
      examples:
      - email: phat@example.test
        password: DemoPassword123!
        fullName: Nguyễn Xuân Phát
        studentCode: '23110209'
        phone: 0900000000
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
      examples:
      - email: phat@example.test
        password: DemoPassword123!
    RefreshTokenRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
      examples:
      - refreshToken: example-refresh-token-replace-after-login
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 128
      examples:
      - currentPassword: DemoPassword123!
        newPassword: NewDemoPassword456!
    AuthResponse:
      type: object
      required:
      - user
      - tokens
      properties:
        user:
          $ref: '#/components/schemas/User'
        tokens:
          $ref: '#/components/schemas/TokenResponse'
      examples:
      - user:
          id: 11111111-1111-4111-8111-111111111111
          email: phat@example.test
          fullName: Nguyễn Xuân Phát
          studentCode: '23110209'
          phone: 0900000000
          avatarUrl: null
          status: ACTIVE
          createdAt: '2026-09-29T12:00:00Z'
          updatedAt: '2026-09-29T12:00:00Z'
        tokens:
          accessToken: example-access-token-replace-after-login
          refreshToken: example-refresh-token-replace-after-login
          accessTokenExpiresAt: '2026-09-29T12:15:00Z'
          refreshTokenExpiresAt: '2026-10-29T12:00:00Z'
    TokenResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshTokenExpiresAt:
          type: string
          format: date-time
      required:
      - accessToken
      - refreshToken
      - accessTokenExpiresAt
      - refreshTokenExpiresAt
      examples:
      - accessToken: example-access-token-replace-after-login
