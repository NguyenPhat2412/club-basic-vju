        roles:
          type:
          - array
          - 'null'
          maxItems: 20
          description: Vai trò gán ngay khi tạo (cùng transaction; một vai trò không hợp lệ thì không tạo tài khoản). Chỉ cấp được quyền mà người tạo đang có.
