spring:
  application:
    name: club-backend
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/club}
    username: ${DB_USERNAME:club}
    password: ${DB_PASSWORD:club_local}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  # Sign-in sessions live in PostgreSQL (tables created by Flyway V12); the browser only keeps
  # the HttpOnly CLUB_SESSION cookie.
  session:
    timeout: ${SESSION_TIMEOUT:12h}
    jdbc:
      initialize-schema: never
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      # Supports 50MB chat videos as well as 20MB formal vault documents (DocumentFileInspector enforces vault limits).
      max-file-size: ${DOCUMENT_MAX_UPLOAD_SIZE:55MB}
      max-request-size: ${CHAT_MAX_REQUEST_SIZE:65MB}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.vju.club

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  max-http-request-header-size: 16KB
  # Trust X-Forwarded-For only from private/loopback proxies (Tomcat RemoteIpValve), so the
  # rate limiter sees the real client IP behind nginx without letting clients spoof it.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  tomcat:
    max-http-form-post-size: 2MB
    max-swallow-size: 2MB
  compression:
    enabled: true
    mime-types: application/json,text/html,text/xml,text/plain,application/javascript,text/css
    min-response-size: 1024

app:
  # The CLUB_SESSION cookie is HttpOnly and SameSite=Lax (SessionConfig). Secure cookies are only
  # sent over HTTPS, so the local profile turns this off.
  session:
    cookie-secure: ${SESSION_COOKIE_SECURE:true}
  # Sign in with a school Google account. Off while GOOGLE_CLIENT_ID is empty. When on, emails on the
  # allowed domains must sign in with Google (password login is refused for them), accounts on those domains
  # need no password, and an account with a student code must use one of those domains.
  auth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      allowed-domains: ${GOOGLE_ALLOWED_DOMAINS:st.vju.ac.vn}
      # true: a school account can sign up from the register page ("Sign up with Google" creates a plain
      # student; clubs are joined by application). false: sign-up is closed and only addresses an admin
      # created beforehand can sign in. Signing in never creates an account.
      create-accounts: ${GOOGLE_CREATE_ACCOUNTS:true}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:15}
    window: ${RATE_LIMIT_WINDOW:1m}
    write-max-requests: ${RATE_LIMIT_WRITE_MAX_REQUESTS:60}
    write-window: ${RATE_LIMIT_WRITE_WINDOW:1m}
    chat-upload-max-requests: ${RATE_LIMIT_CHAT_UPLOAD_MAX_REQUESTS:15}
    chat-upload-window: ${RATE_LIMIT_CHAT_UPLOAD_WINDOW:5m}
  # Document files. local = a folder on this machine (development); r2 = Cloudflare R2 bucket.
  storage:
    type: ${STORAGE_TYPE:local}
    max-file-size: ${DOCUMENT_MAX_FILE_SIZE:20MB}
    download-url-ttl: ${DOCUMENT_DOWNLOAD_URL_TTL:5m}
    local:
      root: ${STORAGE_LOCAL_ROOT:data/documents}
    r2:
      # https://<account-id>.r2.cloudflarestorage.com — the S3 API endpoint, not the public/CDN domain.
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
    gdrive:
      # Centralized Google Drive Vault (SERVICE_ACCOUNT with Workspace Shared Drive, or OAUTH_REFRESH_TOKEN).
      auth-mode: ${GDRIVE_AUTH_MODE:SERVICE_ACCOUNT}
      root-folder-id: ${GDRIVE_ROOT_FOLDER_ID:}
      client-email: ${GDRIVE_CLIENT_EMAIL:}
      private-key: ${GDRIVE_PRIVATE_KEY:}
      client-id: ${GDRIVE_CLIENT_ID:}
      client-secret: ${GDRIVE_CLIENT_SECRET:}
      refresh-token: ${GDRIVE_REFRESH_TOKEN:}
  tasks:
    overdue-check-interval: ${TASK_OVERDUE_CHECK_INTERVAL:300000}
  ai:
    base-url: ${AI_BASE_URL:https://router.anhchau.all1.vn/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:apmarket}
  mail:
    smtp-host: ${SMTP_HOST:}
    smtp-port: ${SMTP_PORT:587}
    smtp-username: ${SMTP_USERNAME:}
    smtp-password: ${SMTP_PASSWORD:}
    smtp-from-email: ${SMTP_FROM_EMAIL:}
    smtp-from-name: ${SMTP_FROM_NAME:VJU ClubHub}
    smtp-start-tls: ${SMTP_START_TLS:true}
  cache:
    type: ${CACHE_TYPE:simple}
    ttl: ${CACHE_TTL:10m}
    asset-max-bytes: ${CACHE_ASSET_MAX_BYTES:2097152}
  qr:
    secret: ${APP_QR_SECRET:}
    asset-ttl: ${CACHE_ASSET_TTL:6h}
  facebook:
    app-id: ${FACEBOOK_APP_ID:}
    app-secret: ${FACEBOOK_APP_SECRET:}
    graph-version: ${FACEBOOK_GRAPH_VERSION:v22.0}
    graph-base-url: ${FACEBOOK_GRAPH_BASE_URL:https://graph.facebook.com}
    token-encryption-key: ${FACEBOOK_TOKEN_ENCRYPTION_KEY:vju-clubhub-local-fb-aes256-key-2026}
    oauth-redirect-uri: ${FACEBOOK_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/integrations/facebook/oauth/callback}
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    auto-sync-poll-ms: ${FACEBOOK_AUTO_SYNC_POLL_MS:300000}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    chat-id: ${TELEGRAM_CHAT_ID:}
    thread-id: ${TELEGRAM_THREAD_ID:}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
