spring:
  application:
    name: club-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/club}
    username: ${DB_USERNAME:club}
    password: ${DB_PASSWORD:club_local}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  servlet:
    multipart:
      # Slightly above app.storage.max-file-size so the precise DOCUMENT_TOO_LARGE check runs in the app.
      max-file-size: ${DOCUMENT_MAX_UPLOAD_SIZE:21MB}
      max-request-size: ${DOCUMENT_MAX_UPLOAD_SIZE:21MB}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.vju.club

server:
  port: ${SERVER_PORT:8080}
  # Trust X-Forwarded-For only from private/loopback proxies (Tomcat RemoteIpValve), so the
  # rate limiter sees the real client IP behind nginx without letting clients spoof it.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

app:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    max-requests: ${RATE_LIMIT_MAX_REQUESTS:60}
    window: ${RATE_LIMIT_WINDOW:1m}
  security:
    jwt:
      # Required outside the local/test profiles: startup fails when JWT_SECRET is missing.
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
    # Expired/revoked refresh tokens are deleted daily once older than the retention period.
    refresh-token-cleanup:
      cron: ${REFRESH_TOKEN_CLEANUP_CRON:0 30 3 * * *}
      retention: ${REFRESH_TOKEN_CLEANUP_RETENTION:7d}
  # Document files. local = a folder on this machine (development); r2 = Cloudflare R2 bucket.
  storage:
    type: ${STORAGE_TYPE:local}
    max-file-size: ${DOCUMENT_MAX_FILE_SIZE:20MB}
    download-url-ttl: ${DOCUMENT_DOWNLOAD_URL_TTL:5m}
    local:
      root: ${STORAGE_LOCAL_ROOT:data/documents}
    r2:
      # https://<account-id>.r2.cloudflarestorage.com — the S3 API endpoint, not the public/CDN domain.
      endpoint: ${R2_ENDPOINT:}
      bucket: ${R2_BUCKET:}
      access-key-id: ${R2_ACCESS_KEY_ID:}
      secret-access-key: ${R2_SECRET_ACCESS_KEY:}
