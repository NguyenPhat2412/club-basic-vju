spring:
  application:
    name: club-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/club}
    username: ${DB_USERNAME:club}
    password: ${DB_PASSWORD:club_local}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  sql:
    init:
      mode: never
  jackson:
    deserialization:
      fail-on-unknown-properties: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.vju.club

server:
  port: ${SERVER_PORT:8080}

app:
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-change-this-value-0123456789}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:30d}
