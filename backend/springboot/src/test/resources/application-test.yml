# The datasource is provided by com.vju.club.integration.TestDatabase: a Testcontainers PostgreSQL
# by default, or the database named by TEST_DB_URL / TEST_DB_USERNAME / TEST_DB_PASSWORD.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  # Integration tests log in far more often than a real client; a dedicated test covers the limiter.
  rate-limit:
    max-requests: 100000
  storage:
    type: local
    local:
      root: ${java.io.tmpdir}/club-test-documents
