services:
  postgres:
    image: postgres:16-alpine
    container_name: vju-club-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vju_club}
      POSTGRES_USER: ${POSTGRES_USER:-vju}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vju_dev_password}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./inf/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vju} -d ${POSTGRES_DB:-vju_club}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
