name: Deploy Stagging

on:
  push:
    branches: [stagging]
    tags:
      - 'v*-stagging*'
      - 'v*-rc*'
  workflow_dispatch:

concurrency:
  group: deploy-stagging
  cancel-in-progress: false

permissions:
  contents: write
  deployments: write

jobs:
  deploy:
    name: Deploy to stagging.vju-club.all1.vn
    runs-on: ubuntu-latest
    environment:
      name: stagging
      url: https://stagging.vju-club.all1.vn
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Ship release to Stagging VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: ./deploy/deploy-stagging.sh "$VPS_HOST" "${GITHUB_SHA}"

      - name: Verify live Stagging HTTPS endpoints
        run: |
          for i in $(seq 1 24); do
            code=$(curl -sS -o /dev/null -w "%{http_code}" https://stagging.vju-club.all1.vn/api/v1/api-catalog || echo "000")
            if [ "$code" = "200" ]; then
              break
            fi
            sleep 3
          done
          curl -fsS https://stagging.vju-club.all1.vn >/dev/null
          curl -fsS https://stagging.vju-club.all1.vn/api/v1/public/clubs >/dev/null

      - name: Publish Stagging Pre-release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          PREV_TAG=$(git tag -l 'v[0-9]*' --sort=-v:refname | grep -v -F "$TAG_NAME" | head -n 1 || true)
          EXTRA_ARGS=()
          if [ -n "$PREV_TAG" ]; then
            EXTRA_ARGS+=(--notes-start-tag "$PREV_TAG")
          fi
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" \
            --title "$TAG_NAME (Stagging)" \
            --prerelease \
            --generate-notes \
            "${EXTRA_ARGS[@]}"
