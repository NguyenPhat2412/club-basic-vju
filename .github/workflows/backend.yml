name: backend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Integration tests start their own PostgreSQL with Testcontainers (Docker is available on the runner).
      - name: Backend tests
        working-directory: backend/springboot
        run: ./mvnw -B test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: API contract checks
        run: |
          pip install pyyaml
          python -m unittest discover -s docs/api/tests
      - name: Docker image builds
        run: docker build -t club-backend backend/springboot
